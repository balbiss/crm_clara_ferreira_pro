# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  ai_followup_job:
    class: AiFollowupJob
    schedule: every 10 minutes
  # Migrados do padrão auto-perpetuante (config/initializers/recurring_jobs.rb,
  # removido) pro recorrente nativo do Solid Queue — incidente 2026-09-01:
  # o padrão antigo duplicava uma corrente inteira a cada boot do
  # backend/worker, empilhando centenas ao longo de semanas de deploys e
  # martelando a API do Jueri com rate limit em cascata (ver JueriSyncJob).
  # Recorrente é agendamento único, deduplicado por task — não duplica nunca.
  jueri_sync:
    class: JueriSyncJob
    schedule: every 30 minutes
  regua_auto_advance:
    class: ReguaAutoAdvanceJob
    schedule: every hour
  check_snoozed_conversations:
    class: CheckSnoozedConversationsJob
    schedule: every minute

development:
  ai_followup_job:
    class: AiFollowupJob
    schedule: every 10 minutes
